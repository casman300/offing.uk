name: deploy-staging

on:
  push:
    branches:
      - rc

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: 8.4
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install PHP dependencies (production)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      # 20i shared hosting has no Node — vendor/ and public/build/ are built here in CI
      # and shipped as static files. Excludes (dev-only files + storage/.env runtime
      # state) live in .github/deploy/rsync-exclude.txt, shared with production.
      #
      # STAGING_DEPLOY_PATH is the document root (public_html) — unchanged, same
      # single secret as before. The app itself goes in a "laravel" subfolder of
      # it rather than a sibling directory (would need a second path secret);
      # that subfolder sits inside the web-servable tree, so the SSH step below
      # locks it down with .htaccess (Require all denied) instead. Only public/'s
      # contents land at the document root itself. See bootstrap/app.php's
      # PUBLIC_PATH handling.
      - name: Deploy app over rsync/ssh
        uses: burnett01/rsync-deployments@66257cad6bfeb2171d3b6bfa6c9a22279dd9c3a1 # 8.0.5
        with:
          switches: -avzr --delete --exclude-from=.github/deploy/rsync-exclude.txt
          path: ./
          remote_path: ${{ secrets.STAGING_DEPLOY_PATH }}/laravel
          remote_host: ${{ secrets.STAGING_SSH_HOST }}
          remote_port: ${{ secrets.STAGING_SSH_PORT }}
          remote_user: ${{ secrets.STAGING_SSH_USER }}
          remote_key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Deploy public assets over rsync/ssh
        uses: burnett01/rsync-deployments@66257cad6bfeb2171d3b6bfa6c9a22279dd9c3a1 # 8.0.5
        with:
          # --delete would otherwise see the sibling "laravel" app directory
          # (not part of this step's public/ source) as extraneous and wipe
          # it — excluding it protects it from deletion consideration too.
          switches: -avzr --delete --exclude=index.php --exclude=/laravel/
          path: public/
          remote_path: ${{ secrets.STAGING_DEPLOY_PATH }}
          remote_host: ${{ secrets.STAGING_SSH_HOST }}
          remote_port: ${{ secrets.STAGING_SSH_PORT }}
          remote_user: ${{ secrets.STAGING_SSH_USER }}
          remote_key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Run migrations & refresh caches
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          port: ${{ secrets.STAGING_SSH_PORT }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            PUBLIC_PATH="${{ secrets.STAGING_DEPLOY_PATH }}"
            APP_PATH="$PUBLIC_PATH/laravel"
            cd "$APP_PATH"

            # Lock the app subfolder down — it sits inside the document root's
            # own directory tree, so nothing should ever serve it directly.
            cat > "$APP_PATH/.htaccess" <<'HTACCESS'
            Require all denied
            HTACCESS

            # index.php can't use its normal `../vendor`-relative requires once
            # the app lives a level down in its own subfolder — same file as
            # public/index.php, paths adjusted. Fully static (the "laravel"
            # subfolder name is a fixed convention, not environment-specific),
            # so no substitution needed.
            cat > "$PUBLIC_PATH/index.php" <<'PHP'
            <?php

            use Illuminate\Http\Request;

            define('LARAVEL_START', microtime(true));

            if (file_exists($maintenance = __DIR__.'/laravel/storage/framework/maintenance.php')) {
                require $maintenance;
            }

            require __DIR__.'/laravel/vendor/autoload.php';

            (require_once __DIR__.'/laravel/bootstrap/app.php')
                ->handleRequest(Request::capture());
            PHP

            # storage/framework/*, storage/logs and storage/app are deliberately
            # excluded from the rsync above so deploys never wipe runtime state —
            # but that means nothing ever creates them on a fresh target either.
            # mkdir -p is a no-op once they exist, so this is safe every deploy.
            mkdir -p storage/framework/{cache/data,sessions,testing,views} storage/logs storage/app/public storage/app/private
            chmod -R 775 storage bootstrap/cache
            php artisan storage:link
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache
