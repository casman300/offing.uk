name: Bug report
description: Something isn't working the way it should
labels: ["type: bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: e.g. staging, production, local dev — browser/OS if relevant
    validations:
      required: false
